services:
  frontend:
    build: ./Frontend
    ports:
      - "9090:80"
    depends_on:
      - gateway

  gateway:
    build: ./Backend/Gateway
    ports:
      - "8000:8000"
    environment:
      - CORS_ALLOW_ORIGINS=http://localhost:9090

# Prolog runs inside the gateway container (`swipl`, see
# Backend/Gateway/app/prolog_engine.py) rather than as its own service, so
# there's no separate "prolog" container to wire in here.
